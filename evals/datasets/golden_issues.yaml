- description: "Create: specialty coffee shop with Berlin address and warm palette"
  vars:
    issue_number: 101
    issue_title: "[New Site]: Röstwerk Kreuzberg"
    request_type: "new_website"
    target_site_slug: "roestwerk-kreuzberg"
    issue_body: |
      ### Business / Site Category
      Coffee Shop
      ### What should the website include?
      Hero section, espresso & filter coffee menu, opening hours (Mon-Sat 08:00-18:00), and our address at Adalbertstraße 15, Berlin.
    expected_status: "ready"
    expected_operation: "create"
    required_utf8:
      - "Adalbertstraße 15"
    rubric: "Returns status='ready' with a valid Coffee Shop WebsiteSpecification containing Adalbertstraße 15, hero, menu, and hours."

