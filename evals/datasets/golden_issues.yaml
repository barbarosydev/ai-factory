- description: "Clarification: contradictory opening hours and city"
  vars:
    issue_number: 106
    issue_title: "[New Site]: Contradictory Bistro"
    request_type: "new_website"
    target_site_slug: ""
    issue_body: |
      ### Business / Site Category
      Restaurant
      ### What should the website include?
      We are located exclusively in Munich, and also our only branch is exclusively in Hamburg. We are closed all week, and open 24/7 every day. Please ask us which city and hours are correct before building.
    expected_status: "needs_clarification"
    rubric: "Returns status='needs_clarification' with 1-3 concise questions resolving the contradictory city and opening hours."

