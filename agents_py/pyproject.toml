[project]
name = "ai-factory-agents"
version = "0.2.0"
description = "PydanticAI Temporal Activity Worker for the local-first AI Software Factory"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "openinference-instrumentation-pydantic-ai>=0.1.0",
  "openinference-semantic-conventions>=0.1.0",
  "opentelemetry-exporter-otlp-proto-http>=1.30.0",
  "opentelemetry-sdk>=1.30.0",
  "pydantic>=2.10.0",
  "pydantic-ai-slim[openai]>=0.1.0",
  "temporalio>=1.10.0",
]

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
