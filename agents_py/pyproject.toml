[project]
name = "ai-factory-agents"
version = "0.2.0"
description = "PydanticAI + MCP Temporal Activity Worker for the local-first AI Software Factory"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mcp>=1.9.0",
  "pydantic>=2.10.0",
  "pydantic-ai-slim[openai]>=0.1.0",
  "temporalio>=1.10.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
