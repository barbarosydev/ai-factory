# Pinned command line tools for ai-factory (latest stable versions).
# Install Homebrew dependencies first with `brew bundle --no-upgrade`, then `mise install`.

[settings]
lockfile = true

[tools]
go = "1.27.4"
golangci-lint = "2.15.0"
conftest = "0.71.1"
task = "3.54.0"
jq = "1.8.2"
yq = "4.54.3"
shellcheck = "0.11.0"
ruff = "0.17.5"
actionlint = "1.7.12"
pre-commit = "4.7.0"
gitleaks = "8.30.1"
temporal = "1.10.1"
